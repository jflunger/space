<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="side">
    <h1 class="side-title" id="spaceTitle">Space</h1>
    <textarea id="notesText" placeholder="Write something…" aria-labelledby="spaceTitle"></textarea>
    <div class="status" id="status"></div>
  </aside>

  <main class="canvas" id="canvas">
    <div class="world" id="world"></div>
    <div class="empty" id="empty">
      <div class="empty-title">A clear space</div>
      <div class="empty-sub">Double-click anywhere to drop a box</div>
    </div>
    <div class="toolbar">
      <button class="tb-btn primary" id="newBox" title="New box (N)">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        <span>New box</span>
      </button>
    </div>
  </main>

  <div class="menu" id="menu" role="menu" hidden></div>

  <div class="modal" id="colorModal" hidden>
    <div class="sheet" role="dialog" aria-label="Edit color">
      <div class="sheet-title">Color</div>
      <div class="sheet-sub" id="colorName"></div>
      <div class="swatches" id="swatches"></div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
