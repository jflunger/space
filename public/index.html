<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="crumbs" id="crumbs">
      <h1><button data-id="">Space</button></h1>
    </div>
    <div class="status" id="status"></div>
  </header>

  <main class="canvas" id="canvas">
    <div class="world" id="world"></div>
    <div class="empty" id="empty">
      <div class="empty-title">A clear space</div>
      <div class="empty-sub">Double-click anywhere to drop a box</div>
    </div>
    <div class="toolbar">
      <button class="tb-btn primary" id="newBox" title="New box (N)">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        <span>New box</span>
      </button>
      <span class="tb-sep" id="textSep" hidden></span>
      <button class="tb-btn" id="textBtn" title="This box's text (T)" hidden>
        <svg viewBox="0 0 16 16"><path d="M3 4h10M3 7h10M3 10h7M3 13h5"/></svg>
        <span>Text</span>
      </button>
    </div>
    <aside class="notes" id="notes" hidden>
      <div class="notes-head">
        <span class="notes-title">Text</span>
        <span class="notes-sub" id="notesSub"></span>
        <button class="notes-close" id="notesClose" title="Close (T)">
          <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <textarea id="notesText" placeholder="Write something…"></textarea>
    </aside>
  </main>

  <div class="menu" id="menu" role="menu" hidden></div>

  <div class="modal" id="colorModal" hidden>
    <div class="sheet" role="dialog" aria-label="Edit color">
      <div class="sheet-title">Color</div>
      <div class="sheet-sub" id="colorName"></div>
      <div class="swatches" id="swatches"></div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
