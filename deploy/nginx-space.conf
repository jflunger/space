# space.adun.ai -> Space (vibe project "space", 127.0.0.1:9000).
#
# Install (as root), same flow as the other adun.ai sites:
#   1. DNS: A record space.adun.ai -> <SERVER_IP>; check `dig +short space.adun.ai`
#   2. cp deploy/nginx-space.conf /etc/nginx/sites-available/space
#      ln -sf /etc/nginx/sites-available/space /etc/nginx/sites-enabled/space
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d space.adun.ai
#      After this, certbot owns the installed copy (it adds the 443 server + redirect).

server {
    listen 80;
    listen [::]:80;
    server_name space.adun.ai;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # The whole board is saved in one PUT; matches the server's 5MB cap.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
